name: Auto Unzip Resources

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip p.zip
        run: |
          if [ -f p.zip ]; then
            echo "p.zip ditemukan"

            rm -rf p
            unzip -o p.zip -d .

            rm p.zip

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add .
            git commit -m "Auto extract p.zip" || echo "Tidak ada perubahan"

            git push
          else
            echo "p.zip tidak ditemukan"
          fi
